name: collect

on:
  # Основной запуск — Worker в Cloudflare (папка worker/): каждые 10 минут
  # и сразу по событию Twitch EventSub, через workflow_dispatch. Этот cron —
  # запасной: schedule GitHub часами пропускает прогоны. Минуты сдвинуты
  # с начала часа (совет документации GitHub) и не совпадают с Worker.
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      delay_sec:
        description: "Пауза перед сбором, секунд (Worker после stream.offline)"
        required: false
        default: "0"

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # ref: main — свежий конец ветки на момент старта. Без него checkout берёт
      # коммит на момент запуска: прогон, ждавший в очереди concurrency, собирал
      # по устаревшему состоянию, и push отклонялся (07.10.2026 — 2 из 56).
      - uses: actions/checkout@v4
        with:
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # После конца эфира Get Streams ещё какое-то время отдаёт канал живым:
      # без паузы прогон по stream.offline увидел бы эфир идущим.
      - name: Wait
        if: ${{ inputs.delay_sec && inputs.delay_sec != '0' }}
        env:
          DELAY: ${{ inputs.delay_sec }}
        run: |
          [[ "$DELAY" =~ ^[0-9]+$ ]] && (( DELAY <= 300 )) || { echo "delay_sec: $DELAY — не число до 300"; exit 1; }
          sleep "$DELAY"

      - name: Collect
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ALERTS_PATH: ${{ runner.temp }}/alerts.txt
        run: python collect.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "Изменений нет — коммита не будет"
            exit 0
          fi
          git config user.name "strymy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      # Смена логина или пропажа канала: данные уже закоммичены выше, а этот шаг
      # завершается ошибкой, чтобы GitHub прислал владельцу письмо о сбое.
      # collect.py пишет сообщение один раз, в прогоне, где событие случилось.
      - name: Alerts
        run: |
          f="$RUNNER_TEMP/alerts.txt"
          if [[ -s "$f" ]]; then
            while IFS= read -r line; do echo "::error::$line"; done < "$f"
            exit 1
          fi
