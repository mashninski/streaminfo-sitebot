name: collect

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Collect
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ALERTS_PATH: ${{ runner.temp }}/alerts.txt
        run: python collect.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "Изменений нет — коммита не будет"
            exit 0
          fi
          git config user.name "strymy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      # Смена логина или пропажа канала: данные уже закоммичены выше, а этот шаг
      # завершается ошибкой, чтобы GitHub прислал владельцу письмо о сбое.
      # collect.py пишет сообщение один раз, в прогоне, где событие случилось.
      - name: Alerts
        run: |
          f="$RUNNER_TEMP/alerts.txt"
          if [[ -s "$f" ]]; then
            while IFS= read -r line; do echo "::error::$line"; done < "$f"
            exit 1
          fi
